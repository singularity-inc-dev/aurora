# Vision and Tom: one system user per person's agent (vt-a-...). Written by install.sh.
# Paperclip logs in as them on 127.0.0.1 to run each agent; their keys live in a
# root-owned folder, so an agent cannot add or change keys.
Match User vt-a-*
    AuthorizedKeysFile /etc/ssh/vision-and-tom/%u
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
Match all
